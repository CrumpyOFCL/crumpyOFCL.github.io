<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype — Designer's workbench</title>
<style>
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: #d7d1c6; color: #241e16; }
  main { max-width: 880px; margin: 0 auto; padding: 1.25rem; }
  .banner { font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; opacity: .7; }
  .bench { position: relative; height: 280px; background: #c4b49a; border: 1px solid #6b5840; }
  .card { position: absolute; width: 180px; min-height: 88px; padding: .6rem; background: #f7f1e4; border: 1px solid #241e16; box-shadow: 3px 3px 0 #241e16; }
  .a { top: 28px; left: 36px; rotate: -3deg; }
  .b { top: 70px; left: 250px; rotate: 2deg; }
  .c { top: 36px; left: 480px; rotate: -1deg; border-style: dashed; }
  @media (max-width: 700px) {
    .bench { height: auto; display: grid; gap: .6rem; padding: .6rem; }
    .card { position: static; width: auto; rotate: none; }
  }
</style>
</head>
<body>
<main>
  <p class="banner">Throwaway prototype — not the portfolio</p>
  <h1>Designer's workbench</h1>
  <p>Artefacts you drag around a desk. Most of the artefacts don't exist yet, so the desk is props. Rejected.</p>
  <div class="bench">
    <div class="card a"><strong>Level sketch</strong><br>Image pending</div>
    <div class="card b"><strong>itch.io build</strong><br>A Course In Time</div>
    <div class="card c"><strong>Playtest report</strong><br>Not published</div>
  </div>
</main>
</body>
</html>
