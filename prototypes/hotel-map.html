<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype — Hotel map</title>
<style>
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: #1a1714; color: #f3ead7; }
  main { max-width: 880px; margin: 0 auto; padding: 1.25rem; }
  .banner { font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; opacity: .65; }
  .hotel { display: grid; grid-template-columns: 1.2fr .8fr .9fr; grid-template-rows: 90px 110px 90px; gap: 8px; }
  a { display: flex; align-items: flex-end; padding: .6rem; color: inherit; text-decoration: none; background: #3a2e24; border: 1px solid #a88b62; min-height: 44px; }
  a strong { display: block; }
  .lobby { grid-column: 1 / 3; background: #6a4a28; }
  .note { font-size: .9rem; }
</style>
</head>
<body>
<main>
  <p class="banner">Throwaway prototype — not the portfolio</p>
  <h1>Explorable hotel</h1>
  <p class="note">Sections are rooms in the Astoria. Appealing, and too slow for a recruiter who has thirty seconds. Not built.</p>
  <div class="hotel">
    <a class="lobby" href="#work"><span><strong>Lobby</strong> Work</span></a>
    <a href="#about"><span><strong>Front desk</strong> About</span></a>
    <a href="#evidence"><span><strong>Ledger office</strong> Evidence</span></a>
    <a href="#method"><span><strong>Workshop</strong> Method</span></a>
    <a href="#contact"><span><strong>Porter</strong> Contact</span></a>
  </div>
</main>
</body>
</html>
